name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Remove all credentials, private endpoints, customer code,
        production logs, personal data, and confidential documents before submitting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Use sanitized technical details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps, mocks, or fixtures that do not contact a real SAP system.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VSP version
      placeholder: v2.38.1-augusto.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality confirmation
      options:
        - label: I confirmed that this report contains no credentials, private endpoints, customer source, production logs, personal data, or confidential documents.
          required: true
