name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Explicit community version (for example v2.38.1-augusto.1).
          Community suffixes avoid ambiguity with upstream releases.
        required: true
        default: ""

# Needed for GoReleaser to publish the release and immutable tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout — full history required by git-cliff and goreleaser
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use a PAT if you need to push to a branch protected by
          # "require status checks" rules. For most repos GITHUB_TOKEN works.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. Set up Go (version comes from go.mod toolchain directive)
      # ------------------------------------------------------------------ #
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ------------------------------------------------------------------ #
      # 3. Run tests — abort the release if anything is red
      # ------------------------------------------------------------------ #
      - name: Run tests
        run: go test ./...

      # ------------------------------------------------------------------ #
      # 4. Validate the explicit community release version
      # ------------------------------------------------------------------ #
      - name: Determine version
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          VERSION="v${INPUT#v}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-augusto\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH-augusto.N" >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      # ------------------------------------------------------------------ #
      # 5. Install git-cliff (pinned to a known-good release)
      # ------------------------------------------------------------------ #
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.12.0

      # ------------------------------------------------------------------ #
      # 6. Generate release notes without pushing to protected main
      # ------------------------------------------------------------------ #
      - name: Generate release notes
        run: |
          git-cliff --tag "${{ steps.version.outputs.version }}" --latest --strip header --output RELEASE_NOTES.md

      # ------------------------------------------------------------------ #
      # 7. Tag and push only the immutable release tag
      # ------------------------------------------------------------------ #
      - name: Tag and push
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # ------------------------------------------------------------------ #
      # 8. GoReleaser — builds all platform binaries, creates GitHub release
      #    Release notes come from git-cliff (GoReleaser changelog is skipped)
      # ------------------------------------------------------------------ #
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
